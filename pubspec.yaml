name: cinemanow
description: "A Flutter movie booking application with authentication, movie listings, seat selection, and payment functionality."

# Prevent accidental publishing
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

#dependencies:
#  flutter:
#    sdk: flutter
#  cupertino_icons: ^1.0.8
#  intl: ^0.18.1
#  flutter_svg: ^2.0.10+1
#  cached_network_image: ^3.4.1
#  shimmer: ^3.0.0
#  confetti: ^0.7.0
#  flutter_animate: ^4.1.1+1
#  share_plus: ^10.1.0
#  provider: ^6.1.2
#  http: ^1.2.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.8.0
  share_plus: ^10.1.0
  http: ^1.2.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  lottie: ^3.1.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  youtube_player_flutter: ^9.0.1
  image_picker: ^1.0.5
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700